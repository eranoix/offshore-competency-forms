# Calendar apps speak WebDAV to /dav/...; every request is passed to the Offshore Report
# function as /api/dav?p=..., because Vercel's edge answers WebDAV methods itself on
# any path a rewrite or dynamic route serves. See api/dav.js. No secret here: the
# calendar password travels in the request and is checked by the function.

map $request_uri $dav_path {
    ~^/dav/?(?<p>[^?]*) $p;
    default "";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

    # Where an app looks first when it is given only the name.
    location = /.well-known/caldav { return 301 /dav/; }

    location ~ ^/dav(/|$) {
        set $upstream "forms.example.com";
        proxy_pass https://$upstream/api/dav?p=$dav_path;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_set_header Host $upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_redirect off;
        proxy_hide_header x-vercel-id;
        proxy_hide_header x-vercel-cache;
        proxy_hide_header strict-transport-security;
    }

    location / { return 404 "Nothing here.\n"; }
}
